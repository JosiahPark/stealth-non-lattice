name: Lean verification

# Builds and audits the Lean project in stealth-lean/ and refreshes its status files.
on:
  push:
    paths:
      - "stealth-lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "stealth-lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

concurrency:
  group: lean-verify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: stealth-lean
    steps:
      - uses: actions/checkout@v4

      # elan reads the pinned toolchain from stealth-lean/lean-toolchain on first use.
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The Mathlib cache download occasionally stalls near the end; retry it once.
      - name: Download the prebuilt Mathlib cache
        timeout-minutes: 25
        run: lake exe cache get || lake exe cache get

      # Keep the compiler output for the status report.
      - name: Build
        run: |
          set -o pipefail
          if lake build 2>&1 | tee build.log; then echo 0 > build.exit; else echo 1 > build.exit; exit 1; fi

      - name: Axiom audit (fails on build errors, sorry, escape hatches or non-standard axioms)
        if: always()
        run: python3 axiom_audit.py

      - name: Publish status to the run summary
        if: always()
        run: |
          if [ -f verification/STATUS.md ]; then cat verification/STATUS.md >> "$GITHUB_STEP_SUMMARY"; \
          else echo "# Lean verification status: FAIL (build did not finish)" >> "$GITHUB_STEP_SUMMARY"; fi

      # Refresh the snapshot inside docs/roadmap.html from ROADMAP.md and STATUS.json.
      - name: Rebuild the roadmap page
        if: always()
        continue-on-error: true
        run: python3 tools/build_roadmap.py

      # Only on main. Commit status and roadmap page only when their content changed (the keys leave out the build time).
      - name: Commit status and roadmap page if changed
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -f verification/STATUS.json ] || exit 0
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("verification/STATUS.json"); d = json.loads(p.read_text())
          d.pop("checked_at", None); d.pop("commit", None)
          pathlib.Path("verification/.status_key").write_text(json.dumps(d, sort_keys=True))
          PY
          git add verification/.status_key
          [ -f docs/.roadmap_key ] && git add docs/.roadmap_key
          if git diff --cached --quiet; then echo "Status and roadmap unchanged"; exit 0; fi
          git add verification/STATUS.md verification/STATUS.json docs/roadmap.html
          git -c user.name="lean-verify" -c user.email="lean-verify@users.noreply.github.com" commit -m "Update Lean verification status and roadmap page"
          # main may have moved on during the build; rebase before pushing.
          for i in 1 2 3; do
            if git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Could not push the status commit after 3 attempts"; exit 1
